[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tlsreq"
version = "0.1.3"
description = "Unified async/sync HTTP client over curl_cffi, wreq, niquests+utls, and httpx+utls"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "xiaoweigege"}]
keywords = ["tls", "http2", "fingerprint", "ja4", "utls", "curl_cffi", "wreq"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.optional-dependencies]
# Chrome 152 在 PyPI 的 xutls（import 仍是 utls）。不要装官方 utls。
curl_cffi = ["curl_cffi>=0.13"]
wreq = ["wreq>=0.12"]
niquests = ["niquests>=3.0", "xutls>=2026.9.7"]
httpx = ["httpx>=0.27", "httpcore>=1.0", "h2>=4.1", "xutls>=2026.9.7"]
all = [
    "tlsreq[curl_cffi]",
    "tlsreq[wreq]",
    "tlsreq[niquests]",
    "tlsreq[httpx]",
]

[project.scripts]
tlsreq-install-utls = "tlsreq.install_utls:main"

[project.urls]
Homepage = "https://github.com/xiaoweigege/tlsreq"
Repository = "https://github.com/xiaoweigege/tlsreq"
Issues = "https://github.com/xiaoweigege/tlsreq/issues"
"xutls (Chrome 152)" = "https://pypi.org/project/xutls/"

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tlsreq*"]

[tool.setuptools.package-data]
tlsreq = ["py.typed"]
