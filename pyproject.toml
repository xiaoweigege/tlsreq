[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tlsreq"
version = "0.1.6"
description = "Unified async/sync HTTP client over curl_cffi, wreq, niquests+utls, and httpx+utls"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "xiaoweigege"}]
keywords = ["tls", "http2", "fingerprint", "ja4", "utls", "curl_cffi", "wreq"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
# 裸装即带默认 httpx 栈（h2 / brotli / zstd / xutls）。Chrome 152 的 TLS 在 xutls。
dependencies = [
    "httpx[brotli,http2]>=0.27",
    "h2>=4.1",
    "brotli>=1.1",
    "zstandard>=0.23",
    "xutls>=2026.9.7",
]

[project.optional-dependencies]
# Chrome 152 在 PyPI 的 xutls（import 仍是 utls）。不要装官方 utls。
curl_cffi = ["curl_cffi>=0.13"]
wreq = ["wreq>=0.12; python_version >= '3.11'"]
niquests = ["niquests>=3.0"]
httpx = ["httpx[brotli,http2]>=0.27"]
all = [
    "tlsreq[curl_cffi]",
    "tlsreq[wreq]",
    "tlsreq[niquests]",
]

[project.urls]
Homepage = "https://github.com/xiaoweigege/tlsreq"
Repository = "https://github.com/xiaoweigege/tlsreq"
Issues = "https://github.com/xiaoweigege/tlsreq/issues"
"xutls (Chrome 152)" = "https://pypi.org/project/xutls/"

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tlsreq*"]

[tool.setuptools.package-data]
tlsreq = ["py.typed"]
