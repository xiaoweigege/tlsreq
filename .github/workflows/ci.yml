name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # wreq>=0.12 需要 Python >=3.11
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[httpx,niquests,wreq]"
      - name: Unit tests
        env:
          TLSREQ_SKIP_LIVE: "1"
        run: python -m unittest discover -s tests -v -p 'test_*.py'
