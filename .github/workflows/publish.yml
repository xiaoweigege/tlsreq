name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: PYPI_API_TOKEN
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build twine
          python -m build
      - name: Publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.__TOKEN__ }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "Skip PyPI upload: environment PYPI_API_TOKEN secret __TOKEN__ is empty."
            exit 1
          fi
          echo "PyPI token is set (length ${#TWINE_PASSWORD})."
          twine upload dist/* --non-interactive
